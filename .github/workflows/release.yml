name: Release

# Triggers when you push a tag matching v* (e.g. `git tag v1.5.3 && git push origin v1.5.3`).
# Verifies the tag matches the version in the .toc, packages a zip with the
# addon files nested inside an AffixDex/ folder, and creates a GitHub Release
# with the zip attached and the matching CHANGELOG section as the release notes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Verify tag matches TOC ## Version
        run: |
          TOC_VERSION=$(awk -F': *' '/^## Version:/ {print $2}' AffixDex.toc | tr -d '\r')
          TAG_VERSION="${{ steps.ver.outputs.version }}"
          if [ "$TOC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag is v$TAG_VERSION but AffixDex.toc says $TOC_VERSION — bump the TOC and re-tag."
            exit 1
          fi
          echo "OK — TOC and tag both at $TOC_VERSION"

      - name: Verify tag matches Lua fallback version
        run: |
          LUA_VERSION=$(grep -oP 'or "\K[0-9]+\.[0-9]+\.[0-9]+(?=")' AffixDex.lua | head -1)
          TAG_VERSION="${{ steps.ver.outputs.version }}"
          if [ "$LUA_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag is v$TAG_VERSION but AffixDex.lua fallback says $LUA_VERSION — bump the Lua fallback and re-tag."
            exit 1
          fi
          echo "OK — Lua fallback also at $LUA_VERSION"

      - name: Stage files into AffixDex/
        run: |
          mkdir -p staging/AffixDex
          cp AffixDex.toc AffixDex.lua README.md CHANGELOG.md LICENSE staging/AffixDex/
          ls -la staging/AffixDex/

      - name: Build zip
        run: |
          cd staging
          zip -r "../AffixDex-${{ steps.ver.outputs.version }}.zip" AffixDex
          cd ..
          unzip -l "AffixDex-${{ steps.ver.outputs.version }}.zip"

      - name: Extract changelog section for this release
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Pull the section between `## $VERSION` and the next `## ` heading.
          awk -v ver="## $VERSION" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # If extraction failed (empty notes), fall back to a generic message.
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION." > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md
          echo "--- end ---"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AffixDex ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: AffixDex-${{ steps.ver.outputs.version }}.zip
          draft: false
          prerelease: false

      # Post a release announcement to Discord. The webhook URL is stored as a
      # GitHub Actions Secret (DISCORD_WEBHOOK_URL) and never lives in the repo.
      # If the secret is unset the step exits cleanly so the release still works.
      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set — skipping Discord announce."
            exit 0
          fi
          # Discord embed description limit is 4096 chars; truncate just in case.
          head -c 3800 release-notes.md > notes-trimmed.md
          # jq -Rs builds a JSON-safe quoted string from the file contents.
          NOTES_JSON=$(jq -Rs . < notes-trimmed.md)
          PAYLOAD=$(cat <<JSON
          {
            "content": "🧩 **AffixDex ${VERSION}** released — https://github.com/kwilliams312/AffixDex/releases/tag/v${VERSION}",
            "embeds": [{
              "title": "AffixDex ${VERSION}",
              "url": "https://github.com/kwilliams312/AffixDex/releases/tag/v${VERSION}",
              "description": ${NOTES_JSON},
              "color": 3447003
            }]
          }
          JSON
          )
          # Post to Discord. -f makes curl exit non-zero on HTTP errors so the
          # workflow surfaces problems instead of failing silently.
          curl -fsS -H "Content-Type: application/json" \
               -X POST "$DISCORD_WEBHOOK_URL" \
               -d "$PAYLOAD"
          echo "Discord announce posted."
